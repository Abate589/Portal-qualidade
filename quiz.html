<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz de BPF</title>

<style>
body {
    font-family: Arial;
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
}

.pergunta {
    margin-bottom: 20px;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}

#resultado {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🐔 Quiz de BPF - CF</h1>

<div class="pergunta">
<p>1. É permitido usar brincos na produção?</p>
<input type="radio" name="q1" value="0"> Sim<br>
<input type="radio" name="q1" value="1"> Não
</div>

<div class="pergunta">
<p>2. O celular é permitido na área produtiva?</p>
<input type="radio" name="q2" value="0"> Sim<br>
<input type="radio" name="q2" value="1"> Não
</div>

<div class="pergunta">
<p>3. As mãos devem ser higienizadas apenas no início do turno?</p>
<input type="radio" name="q3" value="0"> Sim<br>
<input type="radio" name="q3" value="1"> Não
</div>

<button onclick="corrigir()">Ver Resultado</button>

<div id="resultado"></div>

<script>
function corrigir() {
    let pontos = 0;

    let q1 = document.querySelector('input[name="q1"]:checked');
    let q2 = document.querySelector('input[name="q2"]:checked');
    let q3 = document.querySelector('input[name="q3"]:checked');

    if(q1) pontos += Number(q1.value);
    if(q2) pontos += Number(q2.value);
    if(q3) pontos += Number(q3.value);

    document.getElementById("resultado").innerHTML =
        "✅ Você acertou " + pontos + " de 3 perguntas!";
}
</script>

</body>
</html>
